<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Military Aircraft Recognition Quiz | 한·미·나토 군용기 식별 퀴즈</title>
  <style>
    :root {
      --bg-main: #0b111e;
      --bg-card: #151f32;
      --bg-card-hover: #1c2b45;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.3);
      --correct: #22c55e;
      --wrong: #ef4444;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --border: #233554;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px;
    }

    header {
      width: 100%;
      max-width: 760px;
      text-align: center;
      margin-bottom: 20px;
    }

    .badge {
      display: inline-block;
      padding: 4px 12px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 9999px;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .quiz-container {
      width: 100%;
      max-width: 760px;
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background-color: #1e293b;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #0284c7, var(--accent));
      transition: width 0.3s ease;
    }

    .meta-info {
      display: flex;
      justify-content: space-between;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .image-viewport {
      width: 100%;
      height: 380px;
      background-color: #0f172a;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .image-viewport img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }

    .image-viewport img:hover {
      transform: scale(1.02);
    }

    .img-tag {
      position: absolute;
      bottom: 12px;
      left: 12px;
      background: rgba(11, 17, 30, 0.75);
      backdrop-filter: blur(4px);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      color: var(--text-muted);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .question-prompt {
      margin: 18px 0 14px 0;
      font-size: 1.15rem;
      font-weight: 700;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    @media (min-width: 600px) {
      .options-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .option-btn {
      background-color: #0f172a;
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 14px 16px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      transition: all 0.2s ease;
    }

    .option-btn:hover:not(:disabled) {
      background-color: var(--bg-card-hover);
      border-color: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .option-btn .num {
      width: 24px;
      height: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #1e293b;
      border-radius: 50%;
      margin-right: 12px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .option-btn.correct {
      background-color: rgba(34, 197, 94, 0.2) !important;
      border-color: var(--correct) !important;
      color: #86efac !important;
    }

    .option-btn.wrong {
      background-color: rgba(239, 68, 68, 0.2) !important;
      border-color: var(--wrong) !important;
      color: #fca5a5 !important;
    }

    .feedback-box {
      margin-top: 18px;
      padding: 16px;
      border-radius: 10px;
      display: none;
      animation: fadeIn 0.3s ease-in-out;
    }

    .feedback-box.show {
      display: block;
    }

    .feedback-box.is-correct {
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid var(--correct);
    }

    .feedback-box.is-wrong {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid var(--wrong);
    }

    .feedback-title {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .feedback-desc {
      font-size: 0.9rem;
      line-height: 1.5;
      color: #cbd5e1;
    }

    .action-btn-container {
      margin-top: 18px;
      display: flex;
      justify-content: flex-end;
    }

    .next-btn {
      background: linear-gradient(135deg, #0284c7, var(--accent));
      color: #0b111e;
      border: none;
      padding: 12px 24px;
      font-size: 0.95rem;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      display: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .next-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px var(--accent-glow);
    }

    .result-screen {
      display: none;
      text-align: center;
      padding: 20px 0;
    }

    .score-circle {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 4px solid var(--accent);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px auto;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.15) 0%, transparent 70%);
    }

    .score-val {
      font-size: 2.4rem;
      font-weight: 800;
      color: var(--accent);
    }

    .score-total {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <header>
    <div class="badge">Air Force Intelligence Quiz</div>
    <h1>군용 항공기 식별 퀴즈</h1>
    <p class="subtitle">대한민국, 미국, NATO 연합군의 군용기 사진을 보고 기종을 식별해보세요.</p>
  </header>

  <main class="quiz-container">
    <!-- 퀴즈 진행 뷰 -->
    <div id="quiz-view">
      <div class="progress-bar-container">
        <div id="progress-bar" class="progress-bar"></div>
      </div>
      <div class="meta-info">
        <span id="question-number">문제 1 / 10</span>
        <span id="score-counter">현재 점수: 0</span>
      </div>

      <div class="image-viewport">
        <img id="aircraft-image" src="" alt="군용기 식별 대상">
        <div id="angle-tag" class="img-tag">각도: 정면 / 비행 중</div>
      </div>

      <div class="question-prompt">위 사진 속 군용기의 올바른 명칭은 무엇입니까?</div>

      <div class="options-grid" id="options-container">
        <!-- 버튼이 동적으로 생성됩니다 -->
      </div>

      <div id="feedback-box" class="feedback-box">
        <div id="feedback-title" class="feedback-title"></div>
        <div id="feedback-desc" class="feedback-desc"></div>
      </div>

      <div class="action-btn-container">
        <button id="next-btn" class="next-btn" onclick="nextQuestion()">다음 문제 ▶</button>
      </div>
    </div>

    <!-- 최종 결과 뷰 -->
    <div id="result-view" class="result-screen">
      <div class="score-circle">
        <span id="final-score" class="score-val">0</span>
        <span class="score-total">/ 10 문제</span>
      </div>
      <h2 id="result-rank-title" style="margin-bottom: 12px;">항공 식별 평가 완료</h2>
      <p id="result-comment" style="color: var(--text-muted); margin-bottom: 28px; line-height: 1.6;"></p>
      <button class="next-btn" style="display: inline-block;" onclick="restartQuiz()">다시 도전하기 ↺</button>
    </div>
  </main>

  <script>
    // 오디오 피드백 생성용 (Web Audio API)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, type, duration) {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {
        // 무음 처리 fallback
      }
    }

    // 항공기 데이터베이스 (한국, 미국, 나토 / 다양한 촬영 각도)

        explanation: "영국·독일·이탈리아가 공동 개발한 가변익(주날개 각도가 변하는 날개) 전폭기입니다. 비행 속도에 따라 후퇴각이 변하는 주익과 거대한 수직미익, 후방 추력역전장치(Thrust Reverser)가 고유의 외형입니다."

    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let isAnswered = false;

    // 배열 셔플 함수
    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // 퀴즈 초기화 및 10문제 추출
    function initQuiz() {
      const shuffledAll = shuffleArray(AIRCRAFT_DATABASE);
      // 무작위 10개 문제 선택
      currentQuestions = shuffledAll.slice(0, 10);
      currentIndex = 0;
      score = 0;
      document.getElementById('quiz-view').style.display = 'block';
      document.getElementById('result-view').style.display = 'none';
      loadQuestion();
    }

    // 문제 렌더링
    function loadQuestion() {
      isAnswered = false;
      const q = currentQuestions[currentIndex];

      // 프로그레스 바 & 정보 업데이트
      const progressPercent = ((currentIndex + 1) / 10) * 100;
      document.getElementById('progress-bar').style.width = `${progressPercent}%`;
      document.getElementById('question-number').textContent = `문제 ${currentIndex + 1} / 10`;
      document.getElementById('score-counter').textContent = `현재 점수: ${score}`;

      // 이미지 및 각도 태그
      const imgElem = document.getElementById('aircraft-image');
      imgElem.src = q.image;
      document.getElementById('angle-tag').textContent = `분류: ${q.category} | ${q.angle}`;

      // 피드백 박스 & 다음 버튼 초기화
      const fbBox = document.getElementById('feedback-box');
      fbBox.className = 'feedback-box';
      fbBox.style.display = 'none';
      document.getElementById('next-btn').style.display = 'none';

      // 4지선다 옵션 생성 (정답 1개 + 오답 풀에서 3개 추출)
      const distractors = AIRCRAFT_DATABASE.filter(item => item.name !== q.name);
      const shuffledDistractors = shuffleArray(distractors).slice(0, 3);
      const options = shuffleArray([q.name, ...shuffledDistractors.map(d => d.name)]);

      const optionsContainer = document.getElementById('options-container');
      optionsContainer.innerHTML = '';

      options.forEach((optName, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = `<span class="num">${idx + 1}</span><span>${optName}</span>`;
        btn.onclick = () => handleAnswer(optName, q, btn);
        optionsContainer.appendChild(btn);
      });
    }

    // 정답 선택 처리
    function handleAnswer(selectedName, currentQ, clickedBtn) {
      if (isAnswered) return;
      isAnswered = true;

      const isCorrect = selectedName === currentQ.name;
      const fbBox = document.getElementById('feedback-box');
      const fbTitle = document.getElementById('feedback-title');
      const fbDesc = document.getElementById('feedback-desc');
      const allButtons = document.querySelectorAll('.option-btn');

      // 모든 버튼 비활성화 및 정답/오답 하이라이트
      allButtons.forEach(btn => {
        btn.disabled = true;
        const text = btn.querySelector('span:last-child').textContent;
        if (text === currentQ.name) {
          btn.classList.add('correct');
        } else if (btn === clickedBtn && !isCorrect) {
          btn.classList.add('wrong');
        }
      });

      if (isCorrect) {
        score++;
        playBeep(880, 'sine', 0.15); // 정답 사운드 (A5)
        fbBox.className = 'feedback-box show is-correct';
        fbTitle.innerHTML = `<span>🎯 정답입니다! (${currentQ.name})</span>`;
      } else {
        playBeep(220, 'sawtooth', 0.25); // 오답 사운드 (A3)
        fbBox.className = 'feedback-box show is-wrong';
        fbTitle.innerHTML = `<span>❌ 오답입니다! (정답: ${currentQ.name})</span>`;
      }

      fbDesc.innerHTML = `<strong>[식별 포인트 & 해설]</strong><br>${currentQ.explanation}`;
      document.getElementById('score-counter').textContent = `현재 점수: ${score}`;
      document.getElementById('next-btn').style.display = 'inline-block';
    }

    // 다음 문제 버튼 클릭
    function nextQuestion() {
      if (currentIndex < 9) {
        currentIndex++;
        loadQuestion();
      } else {
        showResults();
      }
    }

    // 결과 화면 출력
    function showResults() {
      document.getElementById('quiz-view').style.display = 'none';
      const resultView = document.getElementById('result-view');
      resultView.style.display = 'block';

      document.getElementById('final-score').textContent = score;

      const rankTitle = document.getElementById('result-rank-title');
      const comment = document.getElementById('result-comment');

      if (score === 10) {
        rankTitle.textContent = "🏆 특급 공중정찰 식별관 (Master Recognizer)";
        comment.innerHTML = "놀랍습니다! 한·미·나토 연합군의 모든 기종을 완벽하게 판독해냈습니다.<br>미세한 카나드, 노즐, 인테이크 형상까지 정확히 파악하고 계시네요!";
      } else if (score >= 7) {
        rankTitle.textContent = "🎖️ 상급 항적 판독관 (Expert Analyst)";
        comment.innerHTML = "우수한 성적입니다! 주력 전투기들의 주요 외형과 스펙을 대부분 정확히 인지하고 있습니다.<br>헷갈리기 쉬운 델타익 기종들의 차이점만 보완하면 완벽합니다.";
      } else if (score >= 4) {
        rankTitle.textContent = "✈️ 작전 상황병 (Aviation Enthusiast)";
        comment.innerHTML = "기본적인 대표 기종들은 식별이 가능하지만, 각도에 따라 혼동되는 기종들이 있습니다.<br>다시 도전해서 10점 만점을 노려보세요!";
      } else {
        rankTitle.textContent = "🪖 훈련병 (Recruit)";
        comment.innerHTML = "군용기 식별은 각도와 실루엣에 따라 매우 까다롭습니다.<br>해설에 적힌 각 기종의 고유 식별 포인트(쌍발/단발, 델타익/가변익 등)를 확인하며 다시 도전해보세요!";
      }
    }

    // 다시 시작
    function restartQuiz() {
      initQuiz();
    }

    // 페이지 진입 시 최초 실행
    window.onload = initQuiz;
  </script>
</body>
</html>
