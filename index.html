<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>군사용 비행기 퀴즈 사이트</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>군사용 비행기 퀴즈</h1>
        <div id="theme-selection">
            <h2>주제를 선택하세요</h2>
            <button class="theme-btn" data-theme="0">비슷한 기종 1:1 디테일 비교</button>
            <button class="theme-btn" data-theme="1">함재기 및 해상초계기 전용</button>
            <button class="theme-btn" data-theme="2">스텔스기 / 차세대 기체 식별</button>
            <button class="theme-btn" data-theme="3">특정 임무기 (전자전기 등)</button>
        </div>

        <div id="quiz-section" class="hidden">
            <h2 id="question-title">문제 1 / 10</h2>
            <div class="image-container">
                <img id="aircraft-image" src="" alt="Aircraft Image">
            </div>
            <div id="options-container">
                <!-- 옵션 버튼들이 여기에 추가됩니다 -->
            </div>
            <div id="feedback" class="hidden">
                <p id="feedback-text"></p>
                <button id="next-btn">다음 문제</button>
            </div>
        </div>

        <div id="result-section" class="hidden">
            <h2>퀴즈 완료!</h2>
            <p id="final-score"></p>
            <button id="restart-btn">다시 하기</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
