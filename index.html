<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AeroQuest - Military Aircraft ID Training</title>
    
    <!-- Google Fonts: Orbitron (미래지향적 영문), Noto Sans KR (한국어) -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-magenta: #ff00ff;
            --cyber-dark: #070714;
            --panel-bg: rgba(15, 15, 30, 0.7);
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: var(--cyber-dark);
            color: #ffffff;
            margin: 0;
            overflow-x: hidden;
            /* 사이버펑크 스타일 배경 */
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 243, 255, 0.1), transparent 50%),
                linear-gradient(0deg, rgba(0,0,0,0.8) 0%, transparent 100%),
                url('data:image/svg+xml;utf8,<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"><path d="M0 0h40v40H0V0zm1 1h38v38H1V1z" fill="rgba(0, 243, 255, 0.03)"/></svg>');
        }

        .font-cyber {
            font-family: 'Orbitron', sans-serif;
        }

        /* 스캔라인(Scanline) 오버레이 효과 */
        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.2));
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.6;
        }

        /* 글래스모피즘(Glassmorphism) 패널 */
        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 243, 255, 0.3);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.1);
            position: relative;
        }
        
        .glass-panel::before {
            content: '';
            position: absolute;
            top: -1px; left: -1px;
            width: 20px; height: 20px;
            border-top: 2px solid var(--neon-cyan);
            border-left: 2px solid var(--neon-cyan);
        }
        .glass-panel::after {
            content: '';
            position: absolute;
            bottom: -1px; right: -1px;
            width: 20px; height: 20px;
            border-bottom: 2px solid var(--neon-cyan);
            border-right: 2px solid var(--neon-cyan);
        }

        /* 사이버버튼 스타일 */
        .cyber-btn {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .cyber-btn:hover:not(:disabled) {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 15px var(--neon-cyan);
        }
        .cyber-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .cyber-btn.correct {
            background: #00ff66;
            color: #000;
            border-color: #00ff66;
            box-shadow: 0 0 20px #00ff66;
        }
        .cyber-btn.wrong {
            background: #ff0055;
            color: #fff;
            border-color: #ff0055;
            box-shadow: 0 0 20px #ff0055;
        }

        /* 네온 텍스트 */
        .neon-text-cyan {
            text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan);
        }

        /* 이미지 컨테이너 클리핑 */
        .img-container {
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%);
            border: 2px solid rgba(0, 243, 255, 0.5);
            position: relative;
        }

        .hud-overlay {
            position: absolute;
            top: 10px; left: 10px;
            color: var(--neon-cyan);
            font-size: 0.8rem;
            pointer-events: none;
            opacity: 0.7;
        }

        /* 애니메이션 */
        @keyframes glitch {
            0% { transform: translate(0) }
            20% { transform: translate(-2px, 2px) }
            40% { transform: translate(-2px, -2px) }
            60% { transform: translate(2px, 2px) }
            80% { transform: translate(2px, -2px) }
            100% { transform: translate(0) }
        }
        .glitch-anim {
            animation: glitch 0.3s cubic-bezier(.25, .46, .45, .94) both infinite;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div class="scanlines"></div>

    <div class="w-full max-w-4xl z-10">
        <!-- 헤더 -->
        <header class="text-center mb-8">
            <h1 class="text-4xl md:text-5xl font-cyber font-bold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-600 neon-text-cyan">AERO_QUEST</h1>
            <p class="text-gray-400 mt-2 text-sm tracking-widest font-cyber">MILITARY AIRCRAFT IDENTIFICATION PROTOCOL</p>
            <p class="text-cyan-400 mt-1 text-xs">US / ROK / NATO 연합 항공기 식별 훈련</p>
        </header>

        <!-- 시작 화면 -->
        <div id="start-screen" class="glass-panel p-8 text-center rounded-sm">
            <h2 class="text-2xl font-bold mb-4 text-cyan-300">식별 시스템에 오신 것을 환영합니다</h2>
            <p class="text-gray-300 mb-8 leading-relaxed">
                임의로 제시되는 10개의 군용기 사진을 보고 정확한 기종을 식별하십시오.<br>
                정답 여부와 함께 해당 기종의 외형적 특징이 브리핑됩니다.
            </p>
            <button onclick="startGame()" class="cyber-btn font-cyber text-lg px-10 py-4 uppercase font-bold tracking-wider rounded-sm">
                Initialize Training
            </button>
        </div>

        <!-- 퀴즈 화면 -->
        <div id="quiz-screen" class="hidden flex-col gap-6">
            <!-- HUD 정보 -->
            <div class="flex justify-between items-end font-cyber text-cyan-400 border-b border-cyan-800 pb-2">
                <div class="text-lg tracking-widest">TARGET: <span id="question-counter" class="text-white">01/10</span></div>
                <div class="text-lg tracking-widest">SCORE: <span id="score-display" class="text-white">0</span></div>
            </div>

            <!-- 이미지 영역 -->
            <div class="img-container w-full relative bg-gray-900 rounded-sm overflow-hidden aspect-video flex items-center justify-center">
                <div class="hud-overlay font-cyber text-xs">
                    SYS.OP. NORMAL<br>
                    IMG.REC: ACTIVE<br>
                    REC.SCALE: 800px
                </div>
                <!-- 십자선 UI -->
                <div class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-30">
                    <div class="w-full h-[1px] bg-cyan-500 absolute"></div>
                    <div class="h-full w-[1px] bg-cyan-500 absolute"></div>
                    <div class="w-16 h-16 border border-cyan-500 rounded-full"></div>
                </div>
                <!-- 실제 사진 -->
                <img id="aircraft-image" src="" alt="Aircraft Target" class="max-w-full max-h-full object-contain relative z-0 shadow-2xl" onerror="handleImageError(this)">
            </div>

            <!-- 선택지 버튼 -->
            <div id="options-container" class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-2">
                <!-- 버튼들이 자바스크립트로 주입됩니다. -->
            </div>

            <!-- 피드백(정답해설) 영역 -->
            <div id="feedback-panel" class="glass-panel p-6 rounded-sm hidden mt-4 border-l-4">
                <h3 id="feedback-title" class="text-2xl font-bold mb-2 font-cyber"></h3>
                <p id="feedback-desc" class="text-gray-200 leading-relaxed text-sm md:text-base"></p>
                <div class="mt-6 flex justify-end">
                    <button id="next-btn" onclick="nextQuestion()" class="cyber-btn font-cyber px-6 py-2 uppercase font-bold tracking-wider rounded-sm">
                        Next Target >>
                    </button>
                </div>
            </div>
        </div>

        <!-- 결과 화면 -->
        <div id="result-screen" class="glass-panel p-10 text-center rounded-sm hidden mt-8">
            <h2 class="text-3xl font-bold mb-2 font-cyber text-cyan-300">TRAINING COMPLETE</h2>
            <p class="text-gray-400 mb-6 font-cyber tracking-widest">FINAL SCORE</p>
            <div class="text-6xl font-black mb-8 font-cyber neon-text-cyan">
                <span id="final-score">0</span> / 10
            </div>
            <p id="result-message" class="text-lg text-gray-200 mb-8"></p>
            <button onclick="startGame()" class="cyber-btn font-cyber text-lg px-8 py-3 uppercase font-bold tracking-wider rounded-sm">
                Restart Protocol
            </button>
        </div>
    </div>

    <script>

        /* 유틸리티: 위키미디어 이미지 URL 생성 */
        function getWikiImageUrl(filename) {
            return `https://commons.wikimedia.org/wiki/Special:FilePath/${filename}?width=800`;
        }

        /* 만약 위키미디어 이미지가 로드 실패할 경우 Placehold.co로 대체 (UX 유지 목적) */
        function handleImageError(img) {
            console.warn("Image load failed, using fallback.");
            const currentName = img.getAttribute('data-aircraft-name') || "Unknown";
            img.src = `https://placehold.co/800x450/101020/00f3ff?text=${encodeURIComponent(currentName)}+%5BData+Missing%5D`;
        }

        // 상태 변수
        let currentQuestions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let isAnswered = false;

        // DOM 요소
        const startScreen = document.getElementById('start-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');
        const aircraftImage = document.getElementById('aircraft-image');
        const optionsContainer = document.getElementById('options-container');
        const feedbackPanel = document.getElementById('feedback-panel');
        const feedbackTitle = document.getElementById('feedback-title');
        const feedbackDesc = document.getElementById('feedback-desc');
        const nextBtn = document.getElementById('next-btn');
        const questionCounter = document.getElementById('question-counter');
        const scoreDisplay = document.getElementById('score-display');
        const finalScoreDisplay = document.getElementById('final-score');
        const resultMessage = document.getElementById('result-message');

        // 배열 셔플 함수 (피셔-예이츠)
        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // 게임 시작
        function startGame() {
            startScreen.classList.add('hidden');
            resultScreen.classList.add('hidden');
            quizScreen.classList.replace('hidden', 'flex');

            score = 0;
            currentQuestionIndex = 0;
            scoreDisplay.textContent = score;

            // 전체 데이터에서 10개를 무작위 추출
            const shuffledData = shuffleArray(aircraftDataset);
            currentQuestions = shuffledData.slice(0, 10);

            loadQuestion();
        }

        // 퀴즈 문제 로드
        function loadQuestion() {
            isAnswered = false;
            feedbackPanel.classList.add('hidden');
            
            const currentAircraft = currentQuestions[currentQuestionIndex];
            
            // UI 업데이트
            questionCounter.textContent = `${String(currentQuestionIndex + 1).padStart(2, '0')}/10`;
            aircraftImage.src = getWikiImageUrl(currentAircraft.imageFilename);
            aircraftImage.setAttribute('data-aircraft-name', currentAircraft.name);
            
            // 보기 생성 (정답 1개 + 오답 3개)
            let wrongOptions = aircraftDataset.filter(ac => ac.id !== currentAircraft.id);
            wrongOptions = shuffleArray(wrongOptions).slice(0, 3);
            
            let options = [currentAircraft, ...wrongOptions];
            options = shuffleArray(options); // 보기 섞기

            // 버튼 렌더링
            optionsContainer.innerHTML = '';
            options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'cyber-btn p-4 rounded-sm text-sm md:text-base font-bold tracking-wide text-left flex items-center justify-between';
                btn.innerHTML = `<span>[0${index + 1}]</span> <span>${option.name}</span>`;
                
                btn.onclick = () => selectAnswer(option, btn);
                optionsContainer.appendChild(btn);
            });
        }

        // 답변 선택 처리
        function selectAnswer(selectedOption, buttonElement) {
            if (isAnswered) return;
            isAnswered = true;

            const currentAircraft = currentQuestions[currentQuestionIndex];
            const isCorrect = selectedOption.id === currentAircraft.id;
            
            const allButtons = optionsContainer.querySelectorAll('button');
            
            // 모든 버튼 비활성화 및 정답/오답 표시
            allButtons.forEach(btn => {
                btn.disabled = true;
                const btnName = btn.querySelector('span:nth-child(2)').textContent;
                
                if (btnName === currentAircraft.name) {
                    // 정답인 버튼은 무조건 초록색으로 하이라이트
                    btn.classList.add('correct');
                } else if (btn === buttonElement && !isCorrect) {
                    // 선택한 버튼이 오답이면 빨간색 하이라이트
                    btn.classList.add('wrong');
                }
            });

            // 피드백 패널 업데이트
            feedbackPanel.classList.remove('hidden');
            if (isCorrect) {
                score++;
                scoreDisplay.textContent = score;
                feedbackPanel.style.borderColor = '#00ff66';
                feedbackTitle.innerHTML = `<span class="text-[#00ff66]">MISSION SUCCESS:</span> 정확하게 식별했습니다.`;
                // 시각적 피드백
                aircraftImage.classList.add('border-[#00ff66]');
                setTimeout(() => aircraftImage.classList.remove('border-[#00ff66]'), 500);
            } else {
                feedbackPanel.style.borderColor = '#ff0055';
                feedbackTitle.innerHTML = `<span class="text-[#ff0055]">SYSTEM ERROR:</span> 오답입니다. 정답은 <span class="text-white">${currentAircraft.name}</span> 입니다.`;
                
                // 시각적 글리치 피드백
                document.body.classList.add('glitch-anim');
                setTimeout(() => document.body.classList.remove('glitch-anim'), 300);
            }
            
            // 외형적 특징 설명 주입
            feedbackDesc.textContent = currentAircraft.description;
            
            // 마지막 문제인 경우 버튼 텍스트 변경
            if (currentQuestionIndex === 9) {
                nextBtn.textContent = "Show Final Report";
            } else {
                nextBtn.textContent = "Next Target >>";
            }

            // 피드백 패널로 스크롤 부드럽게 이동
            feedbackPanel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        // 다음 문제로 넘어가기
        function nextQuestion() {
            currentQuestionIndex++;
            
            if (currentQuestionIndex < 10) {
                loadQuestion();
                // 위로 스크롤
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                showResults();
            }
        }

        // 결과 화면 표시
        function showResults() {
            quizScreen.classList.replace('flex', 'hidden');
            resultScreen.classList.remove('hidden');
            
            finalScoreDisplay.textContent = score;
            
            // 점수에 따른 메시지
            if (score === 10) {
                resultMessage.innerHTML = "<span class='text-cyan-400 font-bold'>완벽합니다, 사령관님!</span> 모든 기종을 완벽하게 마스터하셨습니다.";
            } else if (score >= 7) {
                resultMessage.innerHTML = "<span class='text-green-400 font-bold'>우수한 성적입니다.</span> 실전에서도 훌륭한 성과를 기대합니다.";
            } else if (score >= 4) {
                resultMessage.innerHTML = "<span class='text-yellow-400 font-bold'>추가 훈련이 필요합니다.</span> 각 기종의 특징을 다시 한 번 숙지하십시오.";
            } else {
                resultMessage.innerHTML = "<span class='text-red-500 font-bold'>위험 수준입니다.</span> 아군기를 오인 사격하지 않도록 재훈련을 권장합니다.";
            }
        }
    </script>
</body>
</html>
